<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frontend development exam practice project">
    <title>Frontend Exam Lab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<!-- =================================================================
 BODY
 ===================================================================== -->

<body>

    <header>
        <p class="logo">A</p>
    </header>

    <main>

        <section class="card">
            <h1>Dashboard</h1>
            <p>Your AI powered task maneger...</p>

            <div class="status">

                <div class="sbox">
                    <div class="status-head">
                        <h3>Total tasks</h3>
                        <p class="slogo">X</p>
                    </div>
                    <div class="status-body">
                        <p class="counter" id="counter">0</p>
                        <p>All tasks</p>
                    </div>
                </div>

                <div class="sbox">
                    <div class="status-head">
                        <h3>Active tasks</h3>
                        <p class="slogo">X</p>
                    </div>
                    <div class="status-body">
                        <p class="counter" id="counter">0</p>
                        <p>Active tasks</p>
                    </div>
                </div>

                <div class="sbox">
                    <div class="status-head">
                        <h3>Completed tasks</h3>
                        <p class="slogo">X</p>
                    </div>
                    <div class="status-body">
                        <p class="counter" id="task-counter">0</p>
                        <p>Completed tasks</p>
                    </div>
                </div>

            </div>
            
        </section>

    </main>

    <footer>
        (C) 2026 Frontend Exam Lab
    </footer>

    <script src="script.js"></script>

</body>

</html>
